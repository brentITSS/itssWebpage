name: Deploy Frontend to Hostinger
# Manual retrigger marker: keep this comment for path-filter based reruns. Triggered 2026-06-10 default-ftps.

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    # Defaults: FTPS on port 21 (worked historically). Override via repo Variables only if needed.
    # DO NOT set HOSTINGER_FTP_PROTOCOL=sftp or HOSTINGER_FTP_PORT=65002 unless SSH deploy is configured.
    # Optional: HOSTINGER_DEPLOY_METHOD=ssh + secret HOSTINGER_SSH_PRIVATE_KEY for rsync on port 65002.
    env:
      DEPLOY_METHOD: ${{ vars.HOSTINGER_DEPLOY_METHOD != '' && vars.HOSTINGER_DEPLOY_METHOD || 'ftp' }}
      SSH_DEPLOY_PORT: ${{ vars.HOSTINGER_SSH_PORT != '' && vars.HOSTINGER_SSH_PORT || '65002' }}
      FTP_DEPLOY_PROTOCOL: ${{ vars.HOSTINGER_FTP_PROTOCOL != '' && vars.HOSTINGER_FTP_PROTOCOL || 'ftps' }}
      FTP_DEPLOY_PORT: ${{ vars.HOSTINGER_FTP_PORT != '' && vars.HOSTINGER_FTP_PORT || '21' }}
      REMOTE_DIR: /domains/itsson.co.uk/public_html/

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Validate FTP secrets
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "Missing one or more required FTP secrets (HOSTINGER_FTP_SERVER, HOSTINGER_FTP_USERNAME, HOSTINGER_FTP_PASSWORD)."
            exit 1
          fi
          echo "FTP secrets are present."
          echo "Optional repo Variables: HOSTINGER_FTP_PROTOCOL (ftp | ftps | ftps-legacy), HOSTINGER_FTP_PORT (default 21)."

      - name: Log FTP deploy protocol
        run: |
          echo "FTP deploy protocol: ${{ env.FTP_DEPLOY_PROTOCOL }}"
          echo "FTP deploy port: ${{ env.FTP_DEPLOY_PORT }}"

      - name: Create .env.production file
        working-directory: ./frontend
        run: |
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > .env.production
          echo "=== API URL VERIFICATION ==="
          echo "Full URL length: $(echo '${{ secrets.REACT_APP_API_URL }}' | wc -c)"
          echo "Last 50 chars: ...$(echo '${{ secrets.REACT_APP_API_URL }}' | tail -c 51)"
          echo "Ends with /api: $(echo '${{ secrets.REACT_APP_API_URL }}' | grep -q '/api$' && echo 'YES ✅' || echo 'NO ❌')"
          echo "Contains /api: $(echo '${{ secrets.REACT_APP_API_URL }}' | grep -q '/api' && echo 'YES' || echo 'NO')"
          cat .env.production

      - name: Verify environment variable before build
        working-directory: ./frontend
        run: |
          echo "Checking REACT_APP_API_URL before build..."
          echo "Value ends with /api: $(echo '${{ secrets.REACT_APP_API_URL }}' | grep -q '/api$' && echo 'YES' || echo 'NO')"
          echo "Last 40 chars: ...$(echo '${{ secrets.REACT_APP_API_URL }}' | tail -c 41)"
          cat .env.production || echo ".env.production not found"
          
      - name: Clean build directory
        working-directory: ./frontend
        run: rm -rf build

      - name: Verify env var is set before build
        working-directory: ./frontend
        run: |
          echo "REACT_APP_API_URL value: $REACT_APP_API_URL"
          echo "Environment variable length: $(echo $REACT_APP_API_URL | wc -c)"

      - name: Build React app
        working-directory: ./frontend
        run: npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
          NODE_ENV: production

      - name: Verify API URL in built files
        working-directory: ./frontend
        run: |
          echo "Checking if built files contain the API URL..."
          JS_FILE=$(find build/static/js -name "main.*.js" -not -name "*.map" | head -1)
          echo "Checking file: $JS_FILE"
          if grep -q "itsson-api.azurewebsites.net" "$JS_FILE"; then
            echo "Found API URL in built files"
            # Extract and show actual URLs found
            echo "All URLs found:"
            grep -o "https://itsson-api.azurewebsites.net[^\"]*" "$JS_FILE" | head -5 || true
            # Check if URL contains /api path
            if grep -q "itsson-api.azurewebsites.net/api" "$JS_FILE"; then
              echo "✅ URL correctly contains /api path"
            else
              echo "❌ URL missing /api path"
              echo "Sample URLs from file:"
              grep -o "itsson-api.azurewebsites.net[^\"}]*" "$JS_FILE" | head -3
            fi
          else
            echo "Could not find API URL in built files"
          fi

      - name: List build directory contents
        working-directory: ./frontend
        run: |
          echo "Build directory structure:"
          find build -type f | head -20
          echo ""
          echo "Number of files in build/: $(find build -type f | wc -l)"
          echo "Files in build/static/js/: $(find build/static/js -type f 2>/dev/null | wc -l || echo '0')"
          if [ -d "build/static/js" ]; then
            echo "Sample JS files:"
            ls -lh build/static/js/ | head -5
          fi

      - name: Log deploy settings
        run: |
          echo "Deploy method: ${{ env.DEPLOY_METHOD }}"
          echo "FTP protocol/port: ${{ env.FTP_DEPLOY_PROTOCOL }} / ${{ env.FTP_DEPLOY_PORT }}"
          echo "SSH port (when used): ${{ env.SSH_DEPLOY_PORT }}"
          echo "Remote directory: ${{ env.REMOTE_DIR }}"
          if [ "${{ env.FTP_DEPLOY_PROTOCOL }}" = "sftp" ] || [ "${{ env.FTP_DEPLOY_PORT }}" = "65002" ]; then
            echo "::warning::Repo Variables point at SFTP/65002. If deploy fails, delete HOSTINGER_FTP_PROTOCOL and HOSTINGER_FTP_PORT to restore ftps/21 defaults."
          fi

      - name: Validate SSH deploy secrets
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "HOSTINGER_DEPLOY_METHOD=ssh but HOSTINGER_SSH_PRIVATE_KEY is not set."
            echo "hPanel → SSH Access → add public key; store private key PEM as secret HOSTINGER_SSH_PRIVATE_KEY"
            exit 1
          fi
          echo "SSH deploy secrets present."

      - name: Deploy to Hostinger via SSH/rsync
        id: deploy_ssh
        if: env.DEPLOY_METHOD == 'ssh'
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          SSH_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            -e "ssh -p ${{ env.SSH_DEPLOY_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/build/ \
            "${SSH_USER}@${SSH_HOST}:${{ env.REMOTE_DIR }}"

      # Warm DNS + TCP from this runner; does not block deploy if it fails (continue-on-error).
      - name: Preflight — TCP to FTP control port
        if: env.DEPLOY_METHOD == 'ftp'
        id: ftp_preflight
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_PORT: ${{ env.FTP_DEPLOY_PORT }}
        run: |
          set +e
          host="${FTP_SERVER:?}"
          port="${FTP_PORT:?}"
          echo "Preflight: trying TCP to ${host}:${port} (values masked in logs if secret) …"
          ok=0
          for i in 1 2 3 4 5 6 7 8; do
            if timeout 12 bash -c "echo >/dev/tcp/${host}/${port}" 2>/dev/null; then
              echo "Preflight OK on attempt $i"
              ok=1
              break
            fi
            echo "Preflight attempt $i failed, sleep 15s…"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::warning::Preflight could not open TCP to the FTP host from this GitHub runner. Deploy steps still run; if they fail with ETIMEDOUT on :21, allow GitHub egress (see https://api.github.com/meta ) or use Hostinger Git / SSH deploy instead of FTP."
            exit 1
          fi
          exit 0

      - name: Deploy to Hostinger via FTP
        id: deploy_attempt_1
        if: env.DEPLOY_METHOD == 'ftp'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ env.FTP_DEPLOY_PROTOCOL }}
          port: ${{ env.FTP_DEPLOY_PORT }}
          timeout: 300000
          local-dir: ./frontend/build/
          server-dir: ${{ env.REMOTE_DIR }}
          log-level: verbose
          dangerous-clean-slate: true
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules**
          state-name: .ftp-deploy-sync-state.json

      # Transient ETIMEDOUT on :21 is common; brief wait before retry.
      - name: Wait before FTP retry
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure'
        run: sleep 45

      - name: Retry deploy to Hostinger via FTP
        id: deploy_attempt_2
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ env.FTP_DEPLOY_PROTOCOL }}
          port: ${{ env.FTP_DEPLOY_PORT }}
          timeout: 300000
          local-dir: ./frontend/build/
          server-dir: ${{ env.REMOTE_DIR }}
          log-level: verbose
          dangerous-clean-slate: true
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules**
          state-name: .ftp-deploy-sync-state.json

      - name: Wait before FTP retry (attempt 3)
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        run: sleep 90

      - name: Retry deploy to Hostinger via FTP (attempt 3)
        id: deploy_attempt_3
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ env.FTP_DEPLOY_PROTOCOL }}
          port: ${{ env.FTP_DEPLOY_PORT }}
          timeout: 300000
          local-dir: ./frontend/build/
          server-dir: ${{ env.REMOTE_DIR }}
          log-level: verbose
          dangerous-clean-slate: true
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules**
          state-name: .ftp-deploy-sync-state.json

      - name: Wait before FTP retry (attempt 4)
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure'
        run: sleep 120

      - name: Retry deploy to Hostinger via FTP (attempt 4)
        id: deploy_attempt_4
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ env.FTP_DEPLOY_PROTOCOL }}
          port: ${{ env.FTP_DEPLOY_PORT }}
          timeout: 300000
          local-dir: ./frontend/build/
          server-dir: ${{ env.REMOTE_DIR }}
          log-level: verbose
          dangerous-clean-slate: true
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules**
          state-name: .ftp-deploy-sync-state.json

      - name: Wait before FTP retry (attempt 5)
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure' && steps.deploy_attempt_4.outcome == 'failure'
        run: sleep 180

      - name: Retry deploy to Hostinger via FTP (attempt 5)
        id: deploy_attempt_5
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure' && steps.deploy_attempt_4.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ env.FTP_DEPLOY_PROTOCOL }}
          port: ${{ env.FTP_DEPLOY_PORT }}
          timeout: 300000
          local-dir: ./frontend/build/
          server-dir: ${{ env.REMOTE_DIR }}
          log-level: verbose
          dangerous-clean-slate: true
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules**
          state-name: .ftp-deploy-sync-state.json

      - name: Deploy to Hostinger via SSH/rsync (FTP fallback)
        id: deploy_ssh_fallback
        if: env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure' && steps.deploy_attempt_4.outcome == 'failure' && steps.deploy_attempt_5.outcome == 'failure'
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_FTP_SERVER }}
          SSH_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "FTP failed and HOSTINGER_SSH_PRIVATE_KEY is not set; cannot try SSH/rsync fallback."
            exit 1
          fi
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz --delete \
            -e "ssh -p ${{ env.SSH_DEPLOY_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/build/ \
            "${SSH_USER}@${SSH_HOST}:${{ env.REMOTE_DIR }}"

      - name: Validate deploy attempts
        if: (env.DEPLOY_METHOD == 'ssh' && steps.deploy_ssh.outcome != 'success') || (env.DEPLOY_METHOD == 'ftp' && steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure' && steps.deploy_attempt_4.outcome == 'failure' && steps.deploy_attempt_5.outcome == 'failure' && steps.deploy_ssh_fallback.outcome != 'success')
        run: |
          echo "Automatic deploy to Hostinger failed."
          echo "If repo Variables set HOSTINGER_FTP_PROTOCOL=sftp or HOSTINGER_FTP_PORT=65002, delete them to restore ftps/21."
          echo "Confirm HOSTINGER_FTP_SERVER matches the server IP in hPanel (not a proxied domain)."
          echo "For SSH deploy: set HOSTINGER_DEPLOY_METHOD=ssh and add HOSTINGER_SSH_PRIVATE_KEY secret."
          exit 1