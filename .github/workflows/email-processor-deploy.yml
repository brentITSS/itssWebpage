name: Deploy Email Processor Function

on:
  push:
    branches:
      - main
    paths:
      - 'email-processor-function/**'
      - '.github/workflows/email-processor-deploy.yml'
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: itss-email-processor
  FUNCTION_APP_PACKAGE_PATH: './email-processor-function'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.FUNCTION_APP_PACKAGE_PATH }}

      - name: Build
        run: dotnet build ${{ env.FUNCTION_APP_PACKAGE_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.FUNCTION_APP_PACKAGE_PATH }} --configuration Release --output ./publish --no-build

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          sku: flexconsumption
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
